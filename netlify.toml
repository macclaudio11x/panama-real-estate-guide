# Netlify config for panamarealestateguide.com — v2 (Next.js/Supabase) + serverless functions
#
# Cutover (2026-07-31): publish target moved from the v1 static site
# (`project/`, built by .github/workflows/netlify-deploy.yml via the CLI) to
# the v2 Next.js app in `v2/`, built here by @netlify/plugin-nextjs. `base`
# points the build at v2/ (its own package.json/next.config.ts); `directory`
# under [functions] is adjusted to `../netlify/functions` since those
# lambdas live at the repo root, outside `base`. v1's `project/` directory
# and its GitHub Actions deploy workflow are left in the repo — nothing
# currently publishes from them, but the source stays recoverable.
[build]
  base = "v2"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Functions live under /netlify/functions/ (repo root) and are deployed as
  # serverless lambdas. Routed via `export const config = { path: '...' }`
  # inside each .mjs. Path is relative to `base` above.
  directory = "../netlify/functions"
  node_bundler = "esbuild"

# =============================================================================
# 410 GONE — machine-translated locale trees (405 URLs)
# =============================================================================
# Evidence: Semrush Top Pages shows 0 referring domains on every deep URL
# (93 of 103 ref domains point at the root), so no page-level link equity is
# lost. These 405 URLs earned 30 clicks in 119 days combined and cannibalise
# their own English originals (the /de/ page outranks the EN one for the
# English query "retire in panama vs costa rica").
#
# 410 not 404: 410 is an unambiguous "deliberately removed" signal and is
# de-indexed faster; Google retries 404s for months assuming a mistake.
#
# Deliberately NOT redirected to the English equivalents: the content differs,
# and bulk redirects to loosely-related pages are treated as soft 404s.
#
# force = true so these apply even while the static files still exist under
# project/es, project/de, project/pt. Delete those directories in a later
# commit if desired; the rules serve 410 either way and git retains the source.
#
# MUST ship together with: removal of hreflang annotations from the EN pages,
# regeneration of sitemap.xml without these URLs, and disabling the geo-route
# language banner (it advertises these now-dead pages).
[[redirects]]
  from = "/es/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/de/*"
  to = "/410.html"
  status = 410
  force = true

[[redirects]]
  from = "/pt/*"
  to = "/410.html"
  status = 410
  force = true

# =============================================================================
# 301 — /co/ Colombia ad-campaign landings (4 URLs)
# =============================================================================
# Same campaign family as the /proyectos/ landings, and the pages hreflang'd at
# each other. Deliberately NOT 410 like the /es/, /de/ and /pt/ trees above,
# for the same reason as /proyectos/: GSC url-inspection on 2026-08-01 reports
# "URL is unknown to Google, last crawled Never" for these, and 16 months of
# search analytics return no rows at all. There is no index presence to
# withdraw, so a 410 would signal nothing to anyone.
#
# What is left is residual human traffic from a paid Colombian funnel, where an
# error page is strictly worse than the home page. The cutover had already
# dropped these to 404 by omission rather than by decision; this makes the
# disposition explicit.
[[redirects]]
  from = "/co/*"
  to = "/"
  status = 301
  force = true

# 301: collapse duplicate hub URL forms. Both forms draw impressions, splitting
# the signal, so the .html form has to land wherever the slashed form lands.
#
# Point at "/" directly, not at "/articles/" and "/news/". Those trailing-slash
# forms are themselves 301 sources in v2/public/_redirects (lines 4-5, both to
# "/"), so aiming here made a two-hop chain: verified live 2026-08-01,
# /articles/index.html and /news/index.html each took 2 hops to reach
# https://panamarealestateguide.com/ with a 200.
#
# Same class of bug as the /proyectos/ chain fixed in 1f734ee, but this one has
# real search presence riding on it. /articles/ is 0 clicks / 54 impressions /
# avg position 12.3 in seo-strategy-2026/03-url-pruning-inventory.csv, where
# the /proyectos/ slugs had no GSC rows at all.
[[redirects]]
  from = "/articles/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/news/index.html"
  to = "/"
  status = 301
  force = true

# NOTE (rewritten 2026-08-01): /proyectos/ IS handled now, in
# v2/public/_redirects. See the block there for the full rationale and
# evidence. Keep the rules in that one file rather than splitting them here.
#
# The previous note said "/proyectos/ is NOT redirected ... 4 distinct projects
# ... separate content, not duplicates." That was written pre-cutover, and both
# halves stopped holding once [build] publish moved to v2/.next:
#   1. Nothing served them any more, so "not redirected" meant 404, not "live".
#   2. They were never really project pages. All four are templated Spanish
#      ad-campaign landings (Calendly + WhatsApp + utm_ params), and three of
#      the four names do not appear in the project inventory at all.
#
# Only the hub carries index equity: GSC has /proyectos/ as "Submitted and
# indexed" but reports all four detail URLs as unknown and never crawled. So
# the hub keeps its 301 to /projects/, and the detail URLs 301 there too for
# the benefit of residual ad traffic rather than 410 like the locale trees.
# T-10 in seo-strategy-2026/11-technical-seo-backlog.csv is updated to match;
# its old check ("confirm all 4 /proyectos/ slugs still return 200") is void.

